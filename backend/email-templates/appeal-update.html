<div style="margin:0;background:#f7f5ef;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#272a38;line-height:1.6;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e7e4dc;border-radius:12px;overflow:hidden;">
    <div style="height:5px;background:#d6a438;"></div>
    <div style="padding:32px 28px;">
      <p style="margin:0 0 24px;color:#1b2642;font-size:14px;font-weight:700;letter-spacing:0.04em;">AARAMBH</p>
      <h1 style="margin:0 0 16px;color:#1b2642;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.2;font-weight:600;">An update about your Aarambh appeal</h1>
      <p style="margin:0 0 16px;">Hello {{display_name}},</p>
      <p style="margin:0 0 20px;">There is an update about your moderation appeal for <strong>{{content_type}}</strong>: <strong>{{content_name}}</strong>.</p>
      <div style="margin:0 0 20px;padding:18px;background:#fbfaf7;border-left:3px solid #d6a438;border-radius:4px;">
        <p style="margin:0;color:#1b2642;font-weight:700;">{{appeal_status}}</p>
      </div>
      <p style="margin:0 0 6px;font-size:14px;font-weight:700;">Reason</p>
      <p style="margin:0 0 24px;font-size:14px;color:#555967;">{{reason}}</p>
      <p style="margin:0 0 8px;"><a href="{{moderation_url}}" style="display:inline-block;background:#1b2642;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:700;">Review the update</a></p>
    </div>
    <div style="padding:18px 28px;background:#fbfaf7;border-top:1px solid #e7e4dc;color:#686b75;font-size:12px;">
      <strong style="color:#1b2642;">Aarambh</strong><br>Discover local businesses and the people behind them.<br><a href="{{app_url}}" style="color:#1b2642;">Visit Aarambh</a>
    </div>
  </div>
</div>
